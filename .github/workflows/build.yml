name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CT="$SDK/cmdline-tools/latest/bin"
          if [ -x "$CT/sdkmanager" ]; then
            yes | "$CT/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$CT/sdkmanager" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: decrypt_app-release-apk
          path: app/build/outputs/apk/release/*.apk
